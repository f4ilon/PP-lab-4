name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy ccache lcov wrk

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: cd build && ctest --output-on-failure

      - name: Run integration tests
        run: |
          ./build/app &
          APP_PID=$!
          trap "kill $APP_PID 2>/dev/null || true" EXIT
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'
          bash tests/integration_test.sh

      - name: Run load test (wrk)
        run: |
          ./build/app &
          APP_PID=$!
          trap "kill $APP_PID 2>/dev/null || true" EXIT
          timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'
          wrk -t2 -c100 -d10s --latency http://localhost:8080/ | tee wrk-results.txt
          ERRORS=$(grep -oP '\d+ errors' wrk-results.txt | grep -oP '\d+' || echo 0)
          [ "$ERRORS" -lt 10 ] || (echo "Too many errors: $ERRORS" && exit 1)

      - name: Static analysis (clang-tidy)
        run: |
          find src -name '*.cpp' | xargs 
  
  docker-build-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write    # Critical: must be explicitly set

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3    # Use action, not manual login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          echo "REPO_LOWER=${REPO_NAME,,}" >> $GITHUB_ENV

      - name: Build and push image
        run: |
          IMAGE_BASE=ghcr.io/${{ env.REPO_LOWER }}
          
          docker build \
            -t ${IMAGE_BASE}:latest \
            -t ${IMAGE_BASE}:${{ github.sha }} .
          
          docker push ${IMAGE_BASE}:latest
          docker push ${IMAGE_BASE}:${{ github.sha }}

  deploy-staging:
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to staging
        run: |
          docker run -d --name staging-app -p 8080:8080 ghcr.io/${{ env.REPO_LOWER }}:latest
          sleep 5
          curl --retry 5 --retry-delay 2 --fail http://localhost:8080/health || exit 1
          echo "Staging deployment successful" >> deployment.log

      - name: Save staging logs
        if: always()
        run: docker logs staging-app > staging_logs.txt

      - name: Upload staging logs
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs
          path: staging_logs.txt

      - name: Save staging metrics
        run: |
          curl -s http://localhost:8080/metrics > staging_metrics.txt
      - name: Upload staging metrics
        uses: actions/upload-artifact@v4
        with:
          name: staging-metrics
          path: staging_metrics.txt